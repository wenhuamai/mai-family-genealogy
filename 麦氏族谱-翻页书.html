<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>韶關武江麥氏族譜 · 翻頁書</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }
  body {
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background:
      radial-gradient(90vw 55vh at 50% 15%, rgba(255,225,160,0.13), transparent 70%),
      linear-gradient(165deg, #1d140c 0%, #3a2a18 55%, #171008 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    user-select: none;
    -webkit-user-select: none;
  }

  .stage {
    position: relative;
    flex: 1 1 auto;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    perspective: 2000px;
    min-height: 0;
  }
  .book {
    position: relative;
    width: min(94vw, 430px);
    height: min(86vh, calc(min(94vw, 430px) * 1.45));
    transform-style: preserve-3d;
  }
  .cover, .back-cover {
    position: absolute;
    inset: 0;
    border-radius: 4mm 1.5mm 1.5mm 4mm;
    background:
      radial-gradient(120% 120% at 20% 10%, rgba(255,215,130,0.14), transparent 45%),
      radial-gradient(100% 100% at 85% 90%, rgba(30,20,60,0.6), transparent 55%),
      linear-gradient(160deg, #16264b 0%, #0d1733 55%, #070d22 100%);
    border: 0.8mm solid #d9b45c;
    color: #f3e6c4;
    box-shadow: 0 2vh 7vh rgba(0,0,0,0.7), inset 0 0 0 0.3mm rgba(217,180,92,0.5);
    z-index: 10;
  }
  .cover::before, .back-cover::before {
    content: '';
    position: absolute;
    inset: 4mm;
    border: 0.35mm solid rgba(217,180,92,0.65);
    border-radius: 2.5mm;
    pointer-events: none;
  }
  .cover::after {
    content: '❖';
    position: absolute;
    top: 5mm;
    right: 7mm;
    font-size: 18px;
    color: rgba(217,180,92,0.85);
    text-shadow: 0 0 6px rgba(255,220,130,0.5);
  }
  .back-cover { z-index: 0; transform: translateZ(-2px); }
  .cover { transform: translateZ(2px); }
  .bookmark {
    position: absolute;
    top: -2px;
    right: 18%;
    width: 12px;
    height: 44px;
    background: linear-gradient(180deg, #e8c15c, #a8792c);
    border-radius: 0 0 3px 3px;
    box-shadow: 0 3px 6px rgba(0,0,0,0.4);
    z-index: 20;
  }
  .cover { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  .cover .title {
    writing-mode: vertical-rl;
    font-size: clamp(24px, 8vw, 34px);
    font-weight: 700;
    letter-spacing: 0.2em;
    color: #f7e9c2;
    font-family: "Songti SC", "STSong", serif;
    text-shadow: 0 0 4px rgba(255,220,130,0.4), 0 1px 3px rgba(0,0,0,0.6);
    border: 0.3mm solid rgba(217,180,92,0.85);
    padding: 14px 8px;
  }
  .cover .seal {
    writing-mode: vertical-rl;
    text-orientation: upright;
    font-size: 12px;
    letter-spacing: 0.2em;
    border: 0.35mm solid #d9b45c;
    border-radius: 1.5mm;
    padding: 8px 3px;
    margin-top: 16px;
    font-family: "Songti SC", "STSong", serif;
  }
  .cover .meta { margin-top: 14px; font-size: 11px; line-height: 2; letter-spacing: 0.12em; color: #ecd9ac; text-shadow: 0 1px 2px rgba(0,0,0,0.4); }

  .sheet {
    position: absolute;
    inset: 0;
    background:
      linear-gradient(90deg, rgba(122,42,24,0.07) 0 0.7mm, transparent 0.7mm),
      linear-gradient(180deg, #fbf5e3 0%, #f4ead2 100%);
    border-radius: 1.5mm;
    overflow: hidden;
    backface-visibility: hidden;
    box-shadow: inset 0 0 0 0.3mm #c7a967, 0 1vh 3vh rgba(0,0,0,0.35);
    transform-origin: left center;
    transition: transform 0.95s cubic-bezier(0.3, 0.6, 0.2, 0.9);
  }
  .sheet.front { z-index: 5; transform: rotateY(0deg) translateZ(1px); }
  .sheet.back { transform: rotateY(180deg) translateZ(1px); z-index: 1; visibility: hidden; }
  .sheet .inner {
    position: absolute;
    inset: 0;
    padding: clamp(16px, 3.5vh, 28px) clamp(14px, 4vw, 24px) clamp(20px, 4vh, 32px);
    display: flex;
    flex-direction: column;
  }
  .sheet .inner::before, .sheet .inner::after { content: ''; position: absolute; pointer-events: none; }
  .sheet .inner::before { inset: 8px; border: 0.35mm solid #2f3f6d; }
  .sheet .inner::after { inset: 12px; border: 0.18mm solid #c7a967; }
  .sheet header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    border-bottom: 0.4mm double #7a2a18;
    padding-bottom: 5px;
    position: relative;
    z-index: 1;
  }
  .sheet header h3 { margin: 0; font-size: clamp(16px, 4.5vw, 19px); color: #1f2f5e; font-family: "Songti SC", "STSong", serif; letter-spacing: 0.1em; }
  .sheet header span { font-size: 10px; color: #6d5a3e; }
  .sheet footer {
    position: absolute;
    bottom: 10px;
    left: 0; right: 0;
    text-align: center;
    font-size: 8px;
    letter-spacing: 0.3em;
    color: #8a6a2a;
    z-index: 1;
  }
  .entries { flex: 1 1 auto; display: flex; flex-direction: column; gap: 10px; margin-top: 10px; position: relative; z-index: 1; min-height: 0; }
  .entry {
    border: 0.3mm solid #c4a25f;
    border-radius: 2mm;
    background: linear-gradient(180deg, #fffdf7, #fbf5e6);
    box-shadow: 0 1px 3px rgba(70,45,20,0.14);
    display: flex;
    gap: 8px;
    padding: 10px 12px;
    flex: 1 1 auto;
    min-height: 0;
    overflow: hidden;
  }
  .nameplate {
    writing-mode: vertical-rl;
    text-orientation: upright;
    font-size: clamp(17px, 5vw, 21px);
    font-weight: 700;
    color: #1f2f5e;
    border: 0.25mm solid #c98d5f;
    border-radius: 1mm;
    background: linear-gradient(180deg, #f6e9c8, #ecd9ac);
    padding: 8px 3px;
    flex: 0 0 42px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Songti SC", "STSong", serif;
  }
  .body { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; justify-content: center; }
  .body p { margin: 0 0 5px; font-size: clamp(12px, 3.4vw, 14px); line-height: 1.55; color: #2b2420; }
  .body .line1 { font-size: clamp(13px, 3.8vw, 15px); font-weight: 700; color: #7a2a18; }
  .body .kids { color: #3c2f24; }
  .note {
    font-size: 10.5px;
    color: #6d5a3e;
    background: #fbf3df;
    border-radius: 1mm;
    padding: 5px 7px;
    line-height: 1.5;
    margin-top: 2px;
    overflow: hidden;
  }
  .pending {
    font-style: normal;
    font-size: 9px;
    color: #a05b2a;
    border: 0.2mm solid #c98d5f;
    border-radius: 2mm;
    padding: 0 5px;
    margin-left: 4px;
    vertical-align: 1px;
  }
  .toc-grid {
    flex: 1 1 auto;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    align-content: start;
    margin-top: 12px;
    position: relative;
    z-index: 1;
    overflow: hidden;
  }
  .toc-item {
    border: 0.3mm solid #c4a25f;
    background: #fffdf7;
    border-radius: 2mm;
    padding: 10px 6px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    font-family: "Songti SC", "STSong", serif;
    color: #7a2a18;
    cursor: pointer;
    font-size: 14px;
  }
  .toc-item small { color: #6d5a3e; font-size: 10px; font-family: sans-serif; }
  .toc-item:active { background: #f3e6c4; }

  .flip-zone { position: absolute; top: 0; bottom: 0; width: 22%; z-index: 30; cursor: pointer; }
  .flip-zone.left { left: 0; }
  .flip-zone.right { right: 0; }
  .arrow {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: 1px solid rgba(255,235,190,0.4);
    background: rgba(20,13,8,0.7);
    color: #f3e6c4;
    font-size: 19px;
    display: grid;
    place-items: center;
    z-index: 40;
  }
  .arrow.left { left: 8px; }
  .arrow.right { right: 8px; }

  .progress {
    flex: 0 0 auto;
    width: 100%;
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 12px 22px 18px;
    color: #ecd9ac;
    font-size: 12px;
  }
  .bar { flex: 1 1 auto; height: 3px; background: rgba(255,235,190,0.2); border-radius: 2px; overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #c69b4a, #f3e6c4); }
</style>
</head>

  <div class="stage">
    <div class="book" id="book">
      <div class="back-cover"></div>
      <div class="sheet back"><div class="inner" id="back"></div></div>

  <div class="progress">

  </div>
  <script>
    const PAGES = ["\n    <section class=\"page-wrap toc\">\n      <header><h3>目録</h3><span>點擊世次跳轉</span></header>\n      <div class=\"toc-grid\"><button class=\"toc-item\" data-goto=\"0\"><span>第二十四世</span><small>1 人</small></button><button class=\"toc-item\" data-goto=\"1\"><span>第二十五世</span><small>3 人</small></button><button class=\"toc-item\" data-goto=\"3\"><span>第二十六世</span><small>2 人</small></button><button class=\"toc-item\" data-goto=\"4\"><span>第二十七世</span><small>2 人</small></button><button class=\"toc-item\" data-goto=\"5\"><span>第二十八世</span><small>4 人</small></button><button class=\"toc-item\" data-goto=\"7\"><span>第二十九世</span><small>13 人</small></button><button class=\"toc-item\" data-goto=\"14\"><span>第三十世</span><small>22 人</small></button><button class=\"toc-item\" data-goto=\"25\"><span>第三十一世</span><small>58 人</small></button><button class=\"toc-item\" data-goto=\"54\"><span>第三十二世</span><small>143 人</small></button><button class=\"toc-item\" data-goto=\"126\"><span>第三十三世</span><small>171 人</small></button><button class=\"toc-item\" data-goto=\"212\"><span>第三十四世</span><small>42 人</small></button></div>\n      <footer>謹録傳世 · 永昌厥後</footer>\n    </section>","\n        <section class=\"page-wrap\">\n          <header>\n            <h3>第二十四世</h3>\n            <span>1 人 · 第 1 頁</span>\n          </header>\n          <div class=\"entries\">\n    <article class=\"entry\">\n      <div class=\"nameplate\">麥官公</div>\n      <div class=\"body\">\n        <p class=\"line1\">24世 · 开村祖</p>\n        <p>配：范氏</p>\n        <p class=\"kids\">生：名讳失考、名讳失考、名讳失考</p>\n        <p class=\"note\">开村太公麥官公，配范氏，生三子。寿年八十三岁。原稿：由南海丹灶大杏村在清朝中期，一人经商迁入韶关西河（原曲江），从此娶妻生子，建屋买地建祠堂，繁洐后代，至今枝叶茂盛。</p>\n      </div>\n    </article></div>\n          <footer>謹録傳世 · 永昌厥後</footer>\n        </section>","\n        <section class=\"page-wrap\">\n          <header>\n            <h3>第二十五世</h3>\n            <span>2 人 · 第 1 頁</span>\n          </header>\n          <div class=\"entries\">\n    <article class=\"entry\">\n      <div class=\"nameplate\">名讳失考</div>\n      <div class=\"body\">\n        <p class=\"line1\">25世 · 大房</p>\n        <p>配：配氏無考</p>\n        <p class=\"kids\">無子女記錄</p>\n        <p class=\"note\">官公之长子，名讳失考，是为大房。</p>\n      </div>\n    </article>\n    <article class=\"entry\">\n      <div class=\"nameplate\">名讳失考</div>\n      <div class=\"body\">\n        <p class=\"line1\">25世 · 二房</p>\n        <p>配：配氏無考</p>\n        <p class=\"kids\">無子女記錄</p>\n        <p class=\"note\">官公之次子，名讳失考，是为二房。</p>\n      </div>\n    </article></div>\n          <footer>謹録傳世 · 永昌厥後</footer>\n        </section>","\n        <section class=\"page-wrap\">\n          <header>\n            <h3>第二十五世</h3>\n            <span>1 人 · 第 2 頁</span>\n          </header>\n          <div class=\"entries\">\n    <article class=\"entry\">\n      <div class=\"nameplate\">名讳失考</div>\n      <div class=\"body\">\n        <p class=\"line1\">25世 · 三房</p>\n        <p>配：配氏無考</p>\n        <p class=\"kids\">無子女記錄</p>\n        <p class=\"note\">官公之三子，名讳失考，是为三房。</p>\n      </div>\n    </article></div>\n          <footer>謹録傳世 · 永昌厥後</footer>\n        </section>","\n        <section class=\"page-wrap\">\n          <header>\n            <h3>第二十六世</h3>\n            <span>2 人 · 第 1 頁</span>\n          </header>\n          <div class=\"entries\">\n    <article class=\"entry\">\n      <div class=\"nameplate\">秀珍</div>\n      <div class=\"body\">\n        <p class=\"line1\">26世</p>\n        <p>配：配氏無考</p>\n        <p class=\"kids\">生：桂发、慈蕃</p>\n        <p class=\"note\">原稿：“二十六世、秀珍，秀茂…秀珍之子桂发，慈蕃，为上祖之子。”桂发、慈蕃的世次与后代记载略有出入，待考。</p>\n      </div>\n    </article>\n    <article class=\"entry\">\n      <div class=\"nameplate\">秀茂</div>\n      <div class=\"body\">\n        <p class=\"line1\">26世</p>\n        <p>配：配氏無考</p>\n        <p class=\"kids\">無子女記錄</p>\n        <p class=\"note\">原稿：“二十六世、秀珍，秀茂。”</p>\n      </div>\n    </article></div>\n          <footer>謹録傳世 · 永昌厥後</footer>\n        </section>","\n        <section class=\"page-wrap\">\n          <header>\n            <h3>第二十七世</h3>\n            <span>2 人 · 第 1 頁</span>\n          </header>\n          <div class=\"entries\">\n    <article class=\"entry\">\n      <div class=\"nameplate\">尤挍</div>\n      <div class=\"body\">\n        <p class=\"line1\">27世</p>\n        <p>配：配氏無考</p>\n        <p class=\"kids\">無子女記錄</p>\n        <p class=\"note\">原稿：“二十七世尤挍尤穗。”</p>\n      </div>\n    </article>\n    <article class=\"entry\">\n      <div class=\"nameplate\">尤穗</div>\n      <div class=\"body\">\n        <p class=\"line1\">27世</p>\n        <p>配：配氏無考</p>\n        <p class=\"kids\">無子女記錄</p>\n        <p class=\"note\">原稿：“二十七世尤挍尤穗。”</p>\n      </div>\n    </article></div>\n          <footer>謹録傳世 · 永昌厥後</footer>\n        </section>","\n        <section class=\"page-wrap\">\n          <header>\n            <h3>第二十八世</h3>\n            <span>2 人 · 第 1 頁</span>\n          </header>\n          <div class=\"entries\">\n    <article class=\"entry\">\n      <div class=\"nameplate\">受康</div>\n      <div class=\"body\">\n        <p class=\"line1\">28世 · 大房</p>\n        <p>配：配氏無考</p>\n        <p class=\"kids\">生：麒麟</p>\n        <p class=\"note\">原稿：“二十八世孫翁，受康。”二十九世载“大房 受康之子 麒麟配钟氏”。受康之父名讳失考。</p>\n      </div>\n    </article>\n    <article class=\"entry\">\n      <div class=\"nameplate\">桂发</div>\n      <div class=\"body\">\n        <p class=\"line1\">28世 · 二房</p>\n        <p>配：配氏無考</p>\n        <p class=\"kids\">生：兆庭、兆元、兆华、兆林、兆芳</p>\n        <p class=\"note\">原稿：“桂发，濨蕃之子兆庭，兆元，兆华，兆林，兆芳。”父系按“秀珍之子桂发”整理，世次待考。</p>\n      </div>\n    </article></div>\n          <footer>謹録傳世 · 永昌厥後</footer>\n        </section>","\n        <section class=\"page-wrap\">\n          <header>\n            <h3>第二十八世</h3>\n            <span>2 人 · 第 2 頁</span>\n          </header>\n          <div class=\"entries\">\n    <article class=\"entry\">\n      <div class=\"nameplate\">慈蕃</div>\n      <div class=\"body\">\n        <p class=\"line1\">28世 · 二房</p>\n        <p>配：配氏無考</p>\n        <p class=\"kids\">無子女記錄</p>\n        <p class=\"note\">原稿作“慈蕃”，二十九世又作“濨蕃”，疑为同一人。父系按“秀珍之子”整理，世次待考。</p>\n      </div>\n    </article>\n    <article class=\"entry\">\n      <div class=\"nameplate\">孫翁</div>\n      <div class=\"body\">\n        <p class=\"line1\">28世 · 二房</p>\n        <p>配：配氏無考</p>\n        <p class=\"kids\">生：永鸿、兆鸿、德鸿、金鸿</p>\n        <p class=\"note\">原稿：“二十八世孫翁，受康。”二十九世载“孙翁之子，永鸿，兆鸿，徳鸿，金鸿（兄弟）”。孙翁之父名讳失考。</p>\n      </div>\n    </article></div>\n          <footer>謹録傳世 · 永昌厥後</footer>\n        </section>","\n        <section class=\"page-wrap\">\n          <header>\n            <h3>第二十九世</h3>\n            <span>2 人 · 第 1 頁</span>\n          </header>\n          <div class=\"entries\">\n    <article class=\"entry\">\n      <div class=\"nameplate\">麒麟</div>\n      <div class=\"body\">\n        <p class=\"line1\">29世 · 大房</p>\n        <p>配：钟氏</p>\n        <p class=\"kids\">生：自古</p>\n        <p class=\"note\">大房。受康之子，配钟氏。原稿：“麒麟，配氏无考，生一子 自古。”（原文先载配钟氏，后载配氏无考，均保留。）</p>\n      </div>\n    </article>\n    <article class=\"entry\">\n      <div class=\"nameplate\">永鸿</div>\n      <div class=\"body\">\n        <p class=\"line1\">29世 · 二房</p>\n        <p>配：配氏無考</p>\n        <p class=\"kids\">無子女記錄</p>\n        <p class=\"note\">孙翁之子。原稿：“永鸿，配氏无考。无子嗣。”</p>\n      </div>\n    </article></div>\n          <footer>謹録傳世 · 永昌厥後</footer>\n        </section>","\n        <section class=\"page-wrap\">\n          <header>\n            <h3>第二十九世</h3>\n            <span>2 人 · 第 2 頁</span>\n          </header>\n          <div class=\"entries\">\n    <article class=\"entry\">\n      <div class=\"nameplate\">兆鸿</div>\n      <div class=\"body\">\n        <p class=\"line1\">29世 · 二房</p>\n        <p>配：谭氏</p>\n        <p class=\"kids\">生：义祥（過繼）</p>\n        <p class=\"note\">孙翁之子。配谭氏，生一子义祥（德鸿次子过继为嗣）。</p>\n      </div>\n    </article>\n    <article class=\"entry\">\n      <div class=\"nameplate\">德鸿</div>\n      <div class=\"body\">\n        <p class=\"line1\">29世 · 二房</p>\n        <p>配：配     }
    function resetFront(f, content) {
      f.style.transition = 'none';
      f.style.transform = 'rotateY(0deg) translateZ(1px)';
      front.innerHTML = content;
      requestAnimationFrame(() => { requestAnimationFrame(() => { f.style.transition = ''; }); });
    }
    function next() {
      if (busy) return;
      if (cur === 0) {
        cur = 1;
        renderPage(0);
        document.querySelector('.sheet.front').style.transform = 'rotateY(0deg) translateZ(1px)';
        return;
      }
      if (cur > PAGES.length) return;
      busy = true;
      const f = document.querySelector('.sheet.front');
      back.innerHTML = PAGES[cur] !== undefined ? PAGES[cur] : '';
      f.style.transition = 'transform 0.95s cubic-bezier(0.3, 0.6, 0.2, 0.9)';
      f.style.transform = 'rotateY(-180deg) translateZ(1px)';
      setTimeout(() => {
        renderPage(cur);
        resetFront(f, PAGES[cur]);
        cur += 1;
        busy = false;
      }, 950);
    }
    function prev() {
      if (busy) return;
      if (cur <= 1) { renderCover(); cur = 0; return; }
      busy = true;
      cur -= 1;
      const f = document.querySelector('.sheet.front');
      resetFront(f, PAGES[cur - 1]);
      document.getElementById('page-label').textContent = '第 ' + cur + ' 頁';
      document.getElementById('bar').style.width = (cur / PAGES.length * 100) + '%';
      requestAnimationFrame(() => {
        f.style.transition = 'transform 0.95s cubic-bezier(0.3, 0.6, 0.2, 0.9)';
        f.style.transform = 'rotateY(0deg) translateZ(1px)';
      });
      setTimeout(() => { busy = false; }, 950);
    }
    function goto(i) {
      if (i <= 0 || i > PAGES.length) return;
      cur = i;
      renderPage(i - 1);
      const f = document.querySelector('.sheet.front');
      resetFront(f, PAGES[i - 1]);
    }
    document.querySelector('.flip-zone.right').addEventListener('click', next);
    document.querySelector('.flip-zone.left').addEventListener('click', prev);
    document.addEventListener('click', (e) => {
      const t = e.target.closest('.toc-item');
      if (t) goto(Number(t.dataset.goto) + 1);
    });
    let sx = null;
    document.addEventListener('touchstart', (e) => { sx = e.touches[0].clientX; }, { passive: true });
    document.addEventListener('touchend', (e) => {
      if (sx === null) return;
      const dx = e.changedTouches[0].clientX - sx;
      if (Math.abs(dx) > 40) dx < 0 ? next() : prev();
      sx = null;
    }, { passive: true });
    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight') next();
      if (e.key === 'ArrowLeft') prev();
    });
    renderCover();
  </script>
</body>
</html>
