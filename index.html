<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>韶關武江麥氏族譜 · 翻頁書</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }
  body {
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background:
      radial-gradient(90vw 55vh at 50% 15%, rgba(255,225,160,0.13), transparent 70%),
      linear-gradient(165deg, #1d140c 0%, #3a2a18 55%, #171008 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    user-select: none;
    -webkit-user-select: none;
  }

  .stage {
    position: relative;
    flex: 1 1 auto;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    perspective: 2000px;
    min-height: 0;
  }
  .book {
    position: relative;
    width: min(94vw, 430px);
    height: min(86vh, calc(min(94vw, 430px) * 1.45));
    transform-style: preserve-3d;
  }
  .cover, .back-cover {
    position: absolute;
    inset: 0;
    border-radius: 4mm 1.5mm 1.5mm 4mm;
    background:
      radial-gradient(120% 120% at 20% 10%, rgba(255,215,130,0.14), transparent 45%),
      radial-gradient(100% 100% at 85% 90%, rgba(30,20,60,0.6), transparent 55%),
      linear-gradient(160deg, #16264b 0%, #0d1733 55%, #070d22 100%);
    border: 0.8mm solid #d9b45c;
    color: #f3e6c4;
    box-shadow: 0 2vh 7vh rgba(0,0,0,0.7), inset 0 0 0 0.3mm rgba(217,180,92,0.5);
    z-index: 10;
  }
  .cover::before, .back-cover::before {
    content: '';
    position: absolute;
    inset: 4mm;
    border: 0.35mm solid rgba(217,180,92,0.65);
    border-radius: 2.5mm;
    pointer-events: none;
  }
  .cover::after {
    content: '❖';
    position: absolute;
    top: 5mm;
    right: 7mm;
    font-size: 18px;
    color: rgba(217,180,92,0.85);
    text-shadow: 0 0 6px rgba(255,220,130,0.5);
  }
  .back-cover { z-index: 0; transform: translateZ(-2px); }
  .cover { transform: translateZ(2px); }
  .bookmark {
    position: absolute;
    top: -2px;
    right: 18%;
    width: 12px;
    height: 44px;
    background: linear-gradient(180deg, #e8c15c, #a8792c);
    border-radius: 0 0 3px 3px;
    box-shadow: 0 3px 6px rgba(0,0,0,0.4);
    z-index: 20;
  }
  .cover { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  .cover .title {
    writing-mode: vertical-rl;
    font-size: clamp(24px, 8vw, 34px);
    font-weight: 700;
    letter-spacing: 0.2em;
    color: #f7e9c2;
    font-family: "Songti SC", "STSong", serif;
    text-shadow: 0 0 4px rgba(255,220,130,0.4), 0 1px 3px rgba(0,0,0,0.6);
    border: 0.3mm solid rgba(217,180,92,0.85);
    padding: 14px 8px;
  }
  .cover .seal {
    writing-mode: vertical-rl;
    text-orientation: upright;
    font-size: 12px;
    letter-spacing: 0.2em;
    border: 0.35mm solid #d9b45c;
    border-radius: 1.5mm;
    padding: 8px 3px;
    margin-top: 16px;
    font-family: "Songti SC", "STSong", serif;
  }
  .cover .meta { margin-top: 14px; font-size: 11px; line-height: 2; letter-spacing: 0.12em; color: #ecd9ac; text-shadow: 0 1px 2px rgba(0,0,0,0.4); }
  .cover-pattern {
    position: absolute;
    inset: 8mm;
    pointer-events: none;
    background-image: url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%2236%22%20height%3D%2236%22%20viewBox%3D%220%200%2036%2036%22%3E%3Cg%20fill%3D%22none%22%20stroke%3D%22%23b8913f%22%20stroke-width%3D%221.1%22%3E%3Cpath%20d%3D%22M2%2034%20V10%20C2%205%205%202%2010%202%20H34%22%2F%3E%3Cpath%20d%3D%22M9%2027%20V14%20C9%2010%2011%208%2015%208%20H27%22%20opacity%3D%22.65%22%2F%3E%3Cpath%20d%3D%22M16%2020%20V15%20C16%2013%2017%2012%2019%2012%20H20%22%20opacity%3D%22.5%22%2F%3E%3C%2Fg%3E%3C%2Fsvg%3E");
    background-size: 40px 40px;
    opacity: 0.16;
    z-index: 1;
  }
  .cover .title, .cover .seal, .cover .meta { position: relative; z-index: 2; }

  .sheet {
    position: absolute;
    inset: 0;
    background:
      linear-gradient(90deg, rgba(122,42,24,0.07) 0 0.7mm, transparent 0.7mm),
      linear-gradient(180deg, #fbf5e3 0%, #f4ead2 100%);
    border-radius: 1.5mm;
    overflow: hidden;
    backface-visibility: hidden;
    box-shadow: inset 0 0 0 0.3mm #c7a967, 0 1vh 3vh rgba(0,0,0,0.35);
    transform-origin: left center;
    transition: transform 0.95s cubic-bezier(0.3, 0.6, 0.2, 0.9);
  }
  .sheet::before {
    content: '';
    position: absolute;
    inset: 5px;
    pointer-events: none;
    z-index: 0;
    background-image: url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%2236%22%20height%3D%2236%22%20viewBox%3D%220%200%2036%2036%22%3E%3Cg%20fill%3D%22none%22%20stroke%3D%22%23b8913f%22%20stroke-width%3D%221.1%22%3E%3Cpath%20d%3D%22M2%2034%20V10%20C2%205%205%202%2010%202%20H34%22%2F%3E%3Cpath%20d%3D%22M9%2027%20V14%20C9%2010%2011%208%2015%208%20H27%22%20opacity%3D%22.65%22%2F%3E%3Cpath%20d%3D%22M16%2020%20V15%20C16%2013%2017%2012%2019%2012%20H20%22%20opacity%3D%22.5%22%2F%3E%3C%2Fg%3E%3C%2Fsvg%3E");
    background-size: 32px 32px;
    opacity: 0.16;
  }
  .sheet.front { z-index: 5; transform: rotateY(0deg) translateZ(1px); }
  .sheet.back { transform: rotateY(180deg) translateZ(1px); z-index: 1; visibility: hidden; }
  .sheet .inner {
    position: absolute;
    inset: 0;
    padding: clamp(16px, 3.5vh, 28px) clamp(14px, 4vw, 24px) clamp(20px, 4vh, 32px);
    display: flex;
    flex-direction: column;
  }
  .sheet .inner::before, .sheet .inner::after { content: ''; position: absolute; pointer-events: none; }
  .sheet .inner::before { inset: 8px; border: 0.35mm solid #2f3f6d; }
  .sheet .inner::after { inset: 12px; border: 0.18mm solid #c7a967; }
  .sheet .corner {
    position: absolute;
    width: 64px;
    height: 64px;
    z-index: 1;
    pointer-events: none;
    background-image: url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22120%22%20height%3D%22120%22%20viewBox%3D%220%200%20120%20120%22%3E%3Cg%20fill%3D%22none%22%20stroke%3D%22%23b8913f%22%20stroke-width%3D%221.4%22%3E%3Cpath%20d%3D%22M2%20118%20V36%20C2%2017%2017%202%2036%202%20H118%22%2F%3E%3Cpath%20d%3D%22M11%20109%20V43%20C11%2025%2025%2011%2043%2011%20H109%22%20opacity%3D%22.65%22%2F%3E%3Cpath%20d%3D%22M20%2062%20C20%2038%2038%2020%2062%2020%22%20opacity%3D%22.5%22%2F%3E%3Cpath%20d%3D%22M34%2062%20C34%2046%2046%2034%2062%2034%22%20opacity%3D%22.45%22%2F%3E%3Ccircle%20cx%3D%2260%22%20cy%3D%2260%22%20r%3D%229%22%2F%3E%3Ccircle%20cx%3D%2260%22%20cy%3D%2260%22%20r%3D%224.5%22%20fill%3D%22%23b8913f%22%20stroke%3D%22none%22%2F%3E%3Cpath%20d%3D%22M60%202%20V16%20M60%20104%20V118%20M2%2060%20H16%20M104%2060%20H118%22%20opacity%3D%22.8%22%2F%3E%3C%2Fg%3E%3C%2Fsvg%3E");
    background-size: 100% 100%;
    background-repeat: no-repeat;
    opacity: 0.9;
  }
  .sheet .corner.tl { top: 12px; left: 12px; }
  .sheet .corner.tr { top: 12px; right: 12px; transform: rotate(90deg); }
  .sheet .corner.bl { bottom: 26px; left: 12px; transform: rotate(270deg); }
  .sheet .corner.br { bottom: 26px; right: 12px; transform: rotate(180deg); }
  .sheet .corner-center {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 44px;
    height: 44px;
    transform: translate(-50%, -50%) rotate(45deg);
    border: 0.25mm solid rgba(184,145,63,0.55);
    border-radius: 2px;
    pointer-events: none;
    z-index: 1;
    opacity: 0.75;
  }
  .sheet .corner-center::before {
    content: '❖';
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    transform: rotate(-45deg);
    color: rgba(184,145,63,0.7);
    font-size: 15px;
  }
  .sheet .search {
    position: relative;
    z-index: 2;
    margin: 12px 0 8px;
    display: flex;
    gap: 8px;
  }
  .sheet .search input {
    flex: 1 1 auto;
    border: 0.3mm solid #b8913f;
    background: #fffdf7;
    color: #2b2420;
    border-radius: 2mm;
    padding: 9px 11px;
    font-size: 15px;
    font-family: "Songti SC", "STSong", serif;
    outline: none;
    min-width: 0;
  }
  .sheet .search button {
    border: 0.3mm solid #1f2f5e;
    background: #1f2f5e;
    color: #f7e9c2;
    border-radius: 2mm;
    padding: 9px 14px;
    font-size: 14px;
    cursor: pointer;
    font-family: "Songti SC", "STSong", serif;
    flex: 0 0 auto;
  }
  .sheet .search-hit {
    font-size: 11px;
    color: #8a6a2a;
    margin: 0 2px 8px;
    min-height: 16px;
    z-index: 2;
    position: relative;
  }
  .sheet header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    border-bottom: 0.4mm double #7a2a18;
    padding-bottom: 5px;
    position: relative;
    z-index: 1;
  }
  .sheet header h3 { margin: 0; font-size: clamp(16px, 4.5vw, 19px); color: #1f2f5e; font-family: "Songti SC", "STSong", serif; letter-spacing: 0.1em; }
  .sheet header h3::before { content: '❖'; color: #b8913f; font-size: 9px; margin-right: 7px; vertical-align: 2px; }
  .sheet header span { font-size: 10px; color: #6d5a3e; }
  .sheet footer {
    position: absolute;
    bottom: 10px;
    left: 0; right: 0;
    text-align: center;
    font-size: 8px;
    letter-spacing: 0.3em;
    color: #8a6a2a;
    z-index: 1;
  }
  .entries { flex: 1 1 auto; display: flex; flex-direction: column; gap: 10px; margin-top: 10px; position: relative; z-index: 1; min-height: 0; }
  .entry {
    border: 0.3mm solid #c4a25f;
    border-radius: 2mm;
    background: linear-gradient(180deg, #fffdf7, #fbf5e6);
    box-shadow: 0 1px 3px rgba(70,45,20,0.14);
    display: flex;
    gap: 8px;
    padding: 10px 12px;
    flex: 1 1 auto;
    min-height: 0;
    overflow: hidden;
  }
  .entry.highlight {
    border-color: #d9b45c;
    box-shadow: 0 0 0 1.2px #d9b45c, 0 0 18px rgba(217,180,92,0.55);
    animation: glow 1.2s ease 2;
  }
  @keyframes glow {
    0%, 100% { box-shadow: 0 0 0 1.2px #d9b45c, 0 0 12px rgba(217,180,92,0.4); }
    50% { box-shadow: 0 0 0 1.6px #e8c15c, 0 0 24px rgba(232,193,92,0.75); }
  }
  .nameplate {
    writing-mode: vertical-rl;
    text-orientation: upright;
    font-size: clamp(17px, 5vw, 21px);
    font-weight: 700;
    color: #1f2f5e;
    border: 0.25mm solid #c98d5f;
    border-radius: 1mm;
    background: linear-gradient(180deg, #f6e9c8, #ecd9ac);
    padding: 8px 3px;
    flex: 0 0 42px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Songti SC", "STSong", serif;
  }
  .body { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; justify-content: center; }
  .body p { margin: 0 0 5px; font-size: clamp(12px, 3.4vw, 14px); line-height: 1.55; color: #2b2420; }
  .body .line1 { font-size: clamp(13px, 3.8vw, 15px); font-weight: 700; color: #7a2a18; }
  .body .father { color: #8a6a2a; }
  .body .years { color: #6d5a3e; font-size: clamp(11px, 3vw, 12.5px); }
  .body .kids { color: #3c2f24; }
  .note {
    font-size: 10.5px;
    color: #6d5a3e;
    background: #fbf3df;
    border-radius: 1mm;
    padding: 5px 7px;
    line-height: 1.5;
    margin-top: 2px;
    overflow: hidden;
  }
  .pending {
    font-style: normal;
    font-size: 9px;
    color: #a05b2a;
    border: 0.2mm solid #c98d5f;
    border-radius: 2mm;
    padding: 0 5px;
    margin-left: 4px;
    vertical-align: 1px;
  }
  .toc-grid {
    flex: 1 1 auto;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    align-content: start;
    margin-top: 12px;
    position: relative;
    z-index: 1;
    overflow: hidden;
  }
  .toc-item {
    border: 0.3mm solid #c4a25f;
    background: #fffdf7;
    border-radius: 2mm;
    padding: 10px 6px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    font-family: "Songti SC", "STSong", serif;
    color: #7a2a18;
    cursor: pointer;
    font-size: 14px;
  }
  .toc-item small { color: #6d5a3e; font-size: 10px; font-family: sans-serif; }
  .toc-item:active { background: #f3e6c4; }
  .inscription {
    flex: 1 1 auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    position: relative;
    z-index: 1;
    gap: 6px;
  }
  .inscription .big {
    font-family: "Songti SC", "STSong", serif;
    font-size: clamp(26px, 9vw, 40px);
    color: #1f2f5e;
    letter-spacing: 0.3em;
    margin: 0;
    text-shadow: 0 0 8px rgba(184,145,63,0.35);
  }
  .inscription .mid {
    font-family: "Songti SC", "STSong", serif;
    font-size: clamp(14px, 4.5vw, 19px);
    color: #8a6a2a;
    letter-spacing: 0.25em;
    margin: 0;
  }
  .inscription .small {
    font-size: clamp(11px, 3.4vw, 14px);
    color: #6d5a3e;
    letter-spacing: 0.18em;
    margin: 0;
  }
  .inscription .line {
    width: 50%;
    border-top: 0.4mm solid #b8913f;
    margin: 10px 0;
    position: relative;
  }
  .inscription .line::before {
    content: '❖';
    position: absolute;
    left: 50%;
    top: -8px;
    transform: translateX(-50%);
    color: #b8913f;
    font-size: 12px;
    background: #fbf5e3;
    padding: 0 6px;
  }
  .inscription .text {
    max-width: 78%;
    font-size: clamp(12px, 3.6vw, 15px);
    line-height: 2;
    color: #3c2f24;
    margin: 0;
    text-align: justify;
  }

  .flip-zone { position: absolute; top: 0; bottom: 0; width: 22%; z-index: 30; pointer-events: none; }
  .flip-zone.left { left: 0; }
  .flip-zone.right { right: 0; }
  .arrow {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: 1px solid rgba(255,235,190,0.4);
    background: rgba(20,13,8,0.7);
    color: #f3e6c4;
    font-size: 19px;
    display: grid;
    place-items: center;
    z-index: 40;
    pointer-events: auto;
    cursor: pointer;
  }
  .arrow.left { left: 8px; }
  .arrow.right { right: 8px; }

  .progress {
    flex: 0 0 auto;
    width: 100%;
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 12px 22px 18px;
    color: #ecd9ac;
    font-size: 12px;
  }
  .bar { flex: 1 1 auto; height: 3px; background: rgba(255,235,190,0.2); border-radius: 2px; overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #c69b4a, #f3e6c4); }
  .toast {
    position: fixed;
    left: 50%;
    bottom: 74px;
    transform: translateX(-50%);
    background: rgba(13, 23, 51, 0.94);
    border: 0.3mm solid #d9b45c;
    color: #f7e9c2;
    font-size: 13px;
    letter-spacing: 0.08em;
    padding: 9px 18px;
    border-radius: 3mm;
    box-shadow: 0 6px 18px rgba(0,0,0,0.5);
    z-index: 60;
    opacity: 0;
    transition: opacity 0.25s ease;
    pointer-events: none;
    max-width: 86vw;
    text-align: center;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
  <div class="stage">
    <div class="book" id="book">
      <div class="back-cover"></div>
      <div class="sheet back"><div class="inner" id="back"></div></div>
      <div class="sheet front"><div class="inner" id="front"></div></div>
      <div class="bookmark"></div>
      <div class="cover" id="cover"></div>
    </div>
    <div class="flip-zone left"><span class="arrow left">‹</span></div>
    <div class="flip-zone right"><span class="arrow right">›</span></div>
  </div>
  <div class="progress">
    <span id="page-label">封面</span>
    <div class="bar"><i id="bar"></i></div>
    <span id="count-label">共 236 頁</span>
  </div>
  <div class="toast" id="toast"></div>
  <script>

      const hit = document.getElementById('search-hit');
      if (!input || !btn) return;
      const TRAD_MAP = {"麥":"麦","關":"关","孫":"孙","萬":"万","華":"华","偉":"伟","衛":"卫","麗":"丽","龍":"龙","鵬":"鹏","濤":"涛","傑":"杰","強":"强","飛":"飞","國":"国","榮":"荣","權":"权","進":"进","遠":"远","學":"学","廣":"广","門":"门","蘇":"苏","發":"发","風":"风","興":"兴","東":"东","傳":"传","録":"录","鄉":"乡","陽":"阳","莊":"庄","漢":"汉","羅":"罗","歐":"欧","黃":"黄","楊":"杨","陳":"陈","鄧":"邓","鍾":"钟","張":"张","馮":"冯","許":"许","謝":"谢","譚":"谭","葉":"叶","韓":"韩","劉":"刘","無":"无","為":"为","後":"后","繼":"继","長":"长","婦":"妇","時":"时","歲":"岁","遷":"迁","縣":"县","義":"义","禮":"礼"};
      const norm = (s) => String(s).replace(/[麥關孫萬華偉衛麗龍鵬濤傑強飛國榮權進遠學廣門蘇發風興東傳録鄉陽莊漢羅歐黃楊陳鄧鍾張馮許謝譚葉韓劉無為後繼長婦時歲遷縣義禮]/g, (c) => TRAD_MAP[c] || c);
      const run = () => {
        const q = norm(input.value.trim());
        if (!q) { hit.textContent = ''; return; }
        const matches = SEARCH.filter((m) => m.norm.includes(q));
        if (!matches.length) {
          hit.textContent = '未找到「' + input.value.trim() + '」，請檢查姓名寫法';
          return;
        }
        if (matches.length > 1) {
          hit.textContent = '找到 ' + matches.length + ' 位同名族人，已定位第 1 位：' + matches[0].name + '（' + matches[0].generation + '世）';
        } else {
          hit.textContent = '已定位：' + matches[0].name + '（' + matches[0].generation + '世）';
        }
        const m = matches[0];
        showToast('已定位：' + m.name + ' · ' + m.generation + '世');
        if (m.page !== undefined) {
          goto(m.page + 1);
          setTimeout(() => {
            const card = document.querySelector('#front .entry[data-id="' + m.id + '"]');
            if (card) card.classList.add('highlight');
          }, 400);
        }
      };
      btn.addEventListener('click', run);
      input.addEventListener('keydown', (e) => { if (e.key === 'Enter') run(); });
    }
    function resetFront(f, content) {
      f.style.transition = 'none';
      f.style.transform = 'rotateY(0deg) translateZ(1px)';
      front.innerHTML = content;
      if (content.includes('search-input')) bindSearch();
      requestAnimationFrame(() => { requestAnimationFrame(() => { f.style.transition = ''; }); });
    }
    function next() {
      if (busy) return;
      if (cur === 0) {
        cur = 1;
        renderPage(0);
        document.querySelector('.sheet.front').style.transform = 'rotateY(0deg) translateZ(1px)';
        return;
      }
      if (cur > PAGES.length) return;
      busy = true;
      const f = document.querySelector('.sheet.front');
      back.innerHTML = PAGES[cur] !== undefined ? PAGES[cur] : '';
      f.style.transition = 'transform 0.95s cubic-bezier(0.3, 0.6, 0.2, 0.9)';
      f.style.transform = 'rotateY(-180deg) translateZ(1px)';
      setTimeout(() => {
        renderPage(cur);
        resetFront(f, PAGES[cur]);
        cur += 1;
        busy = false;
      }, 950);
    }
    function prev() {
      if (busy) return;
      if (cur <= 1) { renderCover(); cur = 0; return; }
      busy = true;
      cur -= 1;
      const f = document.querySelector('.sheet.front');
      resetFront(f, PAGES[cur - 1]);
      document.getElementById('page-label').textContent = '第 ' + cur + ' 頁';
      document.getElementById('bar').style.width = (cur / PAGES.length * 100) + '%';
      requestAnimationFrame(() => {
        f.style.transition = 'transform 0.95s cubic-bezier(0.3, 0.6, 0.2, 0.9)';
        f.style.transform = 'rotateY(0deg) translateZ(1px)';
      });
      setTimeout(() => { busy = false; }, 950);
    }
    function goto(i) {
      if (i <= 0 || i > PAGES.length) return;
      cur = i;
      renderPage(i - 1);
      const f = document.querySelector('.sheet.front');
      resetFront(f, PAGES[i - 1]);
    }
    document.querySelector('.arrow.right').addEventListener('click', (e) => { e.stopPropagation(); next(); });
    document.querySelector('.arrow.left').addEventListener('click', (e) => { e.stopPropagation(); prev(); });
    document.addEventListener('click', (e) => {
      const t = e.target.closest('.toc-item');
      if (t) goto(Number(t.dataset.goto) + 1);
      if (e.target.closest('input, button, textarea, a, .arrow')) return;
      const rect = document.getElementById('book').getBoundingClientRect();
      if (e.clientX < rect.left + rect.width * 0.24) prev();
      else if (e.clientX > rect.right - rect.width * 0.24) next();
    });
    let sx = null;
    document.addEventListener('touchstart', (e) => { sx = e.touches[0].clientX; }, { passive: true });
    document.addEventListener('touchend', (e) => {
      if (sx === null) return;
      const dx = e.changedTouches[0].clientX - sx;
      if (Math.abs(dx) > 40) dx < 0 ? next() : prev();
      sx = null;
    }, { passive: true });
    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight') next();
      if (e.key === 'ArrowLeft') prev();
    });
    renderCover();
  </script>
</body>
